name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Shrink icon fonts to the glyphs in use
        continue-on-error: true
        run: |
          pip install --quiet fonttools
          python3 tools/subset_icon_fonts.py

      - name: Run automated tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK (arm64-v8a + armeabi-v7a in one file)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Collect and verify the APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" dist/AshTube.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose dist/AshTube.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging dist/AshTube.apk | grep -E "package:|sdkVersion|native-code"
          ls -l dist/AshTube.apk

      - uses: actions/upload-artifact@v5
        with:
          name: AshTube-apk
          path: dist/AshTube.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" dist/AshTube.apk \
            --repo "${{ github.repository }}" \
            --title "AshTube $TAG" \
            --notes "One APK for every Android phone and tablet (32-bit and 64-bit ARM). Built from ${{ github.sha }}."
