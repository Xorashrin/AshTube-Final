name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Shrink icon fonts to the glyphs in use
        continue-on-error: true
        run: |
          pip install --quiet fonttools
          python3 tools/subset_icon_fonts.py

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK (arm64, minified)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK" dist/MythTube.apk
          ls -l dist/MythTube.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)" verify --verbose dist/MythTube.apk

      - uses: actions/upload-artifact@v5
        with:
          name: MythTube-apk
          path: dist/MythTube.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" dist/MythTube.apk \
            --repo "${{ github.repository }}" \
            --title "MythTube $TAG" \
            --notes "Android release (arm64-v8a). Built from ${{ github.sha }}."
