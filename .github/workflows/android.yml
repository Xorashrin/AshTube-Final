name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Shrink icon fonts to the glyphs in use
        continue-on-error: true
        run: |
          pip install --quiet fonttools
          python3 tools/subset_icon_fonts.py

      - name: Type check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APKs (every CPU architecture, minified)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --no-daemon

      - name: Collect and verify APKs
        run: |
          mkdir -p dist
          for f in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            name=$(basename "$f" .apk)
            abi=${name#app-}; abi=${abi%-release}
            [ "$abi" = "release" ] && abi=universal
            cp "$f" "dist/MythTube-$abi.apk"
          done
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for f in dist/*.apk; do "$APKSIGNER" verify "$f" && ls -l "$f"; done

      - uses: actions/upload-artifact@v5
        with:
          name: MythTube-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "MythTube $TAG" \
            --notes "Most phones: MythTube-arm64-v8a.apk. Older 32-bit phones: MythTube-armeabi-v7a.apk. Emulators / Chromebooks: x86 or x86_64. Unsure: MythTube-universal.apk. Built from ${{ github.sha }}."
